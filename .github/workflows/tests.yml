name: tests
on:
  # Every pull request, including docs-only ones, because the checks are required to merge.
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

  # A published release also runs the "install from release" test against it.
  release:
    types: [ published ]

  # Weekly, to catch DDEV changes before developers do.
  schedule:
    - cron: '25 08 * * 1'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Enable remote debugging session
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x -s bash commands/host/* fire-worktrees/lib.sh

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        ddev_version: [stable, HEAD]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
